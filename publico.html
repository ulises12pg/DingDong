<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Turnos - DingDong</title>
    <script src="/static/tailwindcss.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(77, 235, 158, 0.4); } /* Evergreen */
            70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(77, 235, 158, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(77, 235, 158, 0); }
        }

        .nuevo-llamado {
            animation: pulse-green 2s infinite;
            border-width: 4px !important;
            border-color: #4deb9e !important; /* Evergreen */
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c7c7cc; border-radius: 10px; }
    </style>
</head>

<body class="min-h-screen p-6 md:p-10">
    <div class="max-w-7xl mx-auto">
        <!-- Barra Superior Nuve Style -->
        <header class="nuve-window p-6 rounded-[24px] mb-10 flex justify-between items-center sticky top-4 z-40">
            <div class="flex items-center gap-4">
                <div class="flex gap-1.5 px-2">
                    <div class="w-3 h-3 rounded-full bg-[#ed4e9e]"></div> <!-- Fuschia -->
                    <div class="w-3 h-3 rounded-full bg-[#f3d9da]"></div> <!-- Peach -->
                    <div class="w-3 h-3 rounded-full bg-[#4deb9e]"></div> <!-- Evergreen -->
                </div>
                <div class="h-6 w-px bg-[#ecf1f4] mx-2"></div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-[#0e0e10]">DingDong</h1>
                    <p class="text-[11px] font-bold text-[#4b56ed] uppercase tracking-widest">Panel Público de Turnos</p>
                </div>
            </div>
            <div class="text-right hidden md:block">
                <p id="fecha" class="text-xs font-bold text-[#0e0e10]/40 uppercase tracking-wider mb-1"></p>
                <p id="reloj" class="text-4xl font-bold text-[#0e0e10]"></p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <!-- Columna: EN CONSULTA -->
            <section class="flex flex-col gap-6">
                <div class="flex items-center justify-between px-2">
                    <h2 class="text-xs font-bold text-[#4deb9e] uppercase tracking-wider flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-[#4deb9e] animate-pulse"></span>
                        Pasar ahora a Consulta
                    </h2>
                </div>
                <div id="consulta-lista" class="space-y-6">
                    <!-- Tarjetas de consulta -->
                </div>
            </section>

            <!-- Columna: PRÓXIMOS -->
            <section class="flex flex-col gap-6">
                <div class="flex items-center justify-between px-2">
                    <h2 class="text-xs font-bold text-[#0e0e10]/40 uppercase tracking-wider">Próximos en Espera</h2>
                </div>
                <div id="espera-lista" class="space-y-4">
                    <!-- Lista de espera -->
                </div>
            </section>
        </div>
    </div>

    <!-- Sonido -->
    <script>
        const API_URL = "";
        let idsEnEscena = new Set();
        let primerCarga = true;

        // Reloj y Fecha
        setInterval(() => {
            const now = new Date();
            document.getElementById('reloj').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('fecha').innerText = now.toLocaleDateString('es-ES', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
        }, 1000);

        async function cargarDatos() {
            try {
                const res = await fetch(`${API_URL}/turnos`);
                const turnos = await res.json();

                const consultaDiv = document.getElementById('consulta-lista');
                const esperaDiv = document.getElementById('espera-lista');

                consultaDiv.innerHTML = '';
                esperaDiv.innerHTML = '';

                let alguienNuevo = false;

                turnos.forEach(p => {
                    if (p.estado === 'consulta') {
                        if (!idsEnEscena.has(p.id)) alguienNuevo = true;

                        const card = document.createElement('div');
                        card.className = `nuve-card p-10 rounded-[30px] border-l-[12px] border-[#4deb9e] flex justify-between items-center ${primerCarga ? '' : 'nuevo-llamado'}`;
                        card.innerHTML = `
                            <div>
                                <p class="text-[12px] text-[#4deb9e] font-bold uppercase tracking-widest mb-3">Llamado Actual</p>
                                <h4 class="text-7xl font-bold text-[#0e0e10]">${p.nombre}</h4>
                                <p class="text-xl font-semibold text-[#0e0e10]/40 uppercase mt-2">${p.motivo}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-5xl font-bold text-[#0e0e10]">C01</p>
                                <p class="text-[12px] text-[#0e0e10]/40 font-bold mt-2 uppercase">Consultorio</p>
                            </div>
                        `;
                        consultaDiv.appendChild(card);
                    } else if (p.estado === 'espera') {
                        const row = document.createElement('div');
                        row.className = "nuve-card p-6 bg-white border-l-[8px] border-[#ed4e9e] flex justify-between items-center opacity-90";
                        row.innerHTML = `
                            <div>
                                <p class="text-3xl font-bold text-[#0e0e10]">${p.nombre}</p>
                                <p class="text-[12px] font-bold text-[#0e0e10]/40 uppercase tracking-widest mt-1">${p.motivo}</p>
                            </div>
                            <span class="text-[11px] font-bold text-[#ed4e9e] bg-[#f3d9da] px-3 py-1 rounded-full uppercase">Siguiente</span>
                        `;
                        esperaDiv.appendChild(row);
                    }
                });

                if (alguienNuevo && !primerCarga) {
                    playDingDong();
                }

                idsEnEscena = new Set(turnos.map(p => p.id));
                primerCarga = false;

            } catch (e) {
                console.error("Error cargando pantalla pública", e);
            }
        }

        function conectarWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            const socket = new WebSocket(wsUrl);
            socket.onmessage = () => cargarDatos();
            socket.onclose = () => setTimeout(conectarWS, 3000);
        }

        function playDingDong() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audioCtx = new AudioContext();
            function playTone(freq, time, duration, vol) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(time);
                gain.gain.setValueAtTime(vol, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                osc.stop(time + duration);
            }
            const now = audioCtx.currentTime;
            playTone(880, now, 1.0, 0.5);       // Ding
            playTone(660, now + 0.6, 1.5, 0.5); // Dong
        }

        cargarDatos();
        conectarWS();
    </script>
</body>

</html>
