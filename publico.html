<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Turnos - DingDong</title>
    <script src="/static/tailwindcss.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .macos-window {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .macos-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulse-green {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
            }

            70% {
                transform: scale(1.02);
                box-shadow: 0 0 0 20px rgba(34, 197, 94, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .nuevo-llamado {
            animation: pulse-green 2s infinite;
            border: 2px solid #10b981 !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

<body class="min-h-screen p-8 text-slate-800">
    <div class="max-w-7xl mx-auto">
        <!-- Barra Superior Tipo macOS -->
        <header class="macos-window p-6 rounded-2xl mb-10 flex justify-between items-center sticky top-4 z-40">
            <div class="flex items-center gap-4">
                <div class="flex gap-1.5 px-2">
                    <div class="w-3 h-3 rounded-full bg-red-400"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                    <div class="w-3 h-3 rounded-full bg-green-400"></div>
                </div>
                <div class="h-6 w-px bg-slate-200 mx-2"></div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-700">DingDong</h1>
                    <p class="text-[10px] font-bold text-blue-500 uppercase tracking-widest">Panel Público de Turnos</p>
                </div>
            </div>
            <div class="text-right hidden md:block">
                <p id="fecha" class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1"></p>
                <p id="reloj" class="text-3xl font-light text-slate-800"></p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <!-- Columna: EN CONSULTA -->
            <section class="flex flex-col gap-6">
                <div class="flex items-center justify-between px-2">
                    <h2 class="text-xs font-bold text-emerald-600 uppercase tracking-wider flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Pasar ahora a Consulta
                    </h2>
                </div>
                <div id="consulta-lista" class="space-y-6">
                    <!-- Tarjetas de consulta -->
                </div>
            </section>

            <!-- Columna: PRÓXIMOS -->
            <section class="flex flex-col gap-6">
                <div class="flex items-center justify-between px-2">
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Próximos en Espera</h2>
                </div>
                <div id="espera-lista" class="space-y-4">
                    <!-- Lista de espera -->
                </div>
            </section>
        </div>
    </div>

    <!-- Sonido -->
    <script>
        const API_URL = "";
        let idsEnEscena = new Set();
        let primerCarga = true;

        // Reloj y Fecha
        setInterval(() => {
            const now = new Date();
            document.getElementById('reloj').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('fecha').innerText = now.toLocaleDateString('es-ES', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
        }, 1000);

        async function cargarDatos() {
            try {
                const res = await fetch(`${API_URL}/turnos`);
                const turnos = await res.json();

                const consultaDiv = document.getElementById('consulta-lista');
                const esperaDiv = document.getElementById('espera-lista');

                consultaDiv.innerHTML = '';
                esperaDiv.innerHTML = '';

                let alguienNuevo = false;

                turnos.forEach(p => {
                    if (p.estado === 'consulta') {
                        if (!idsEnEscena.has(p.id)) alguienNuevo = true;

                        const card = document.createElement('div');
                        card.className = `macos-card p-8 rounded-3xl shadow-xl border-l-[10px] border-emerald-500 flex justify-between items-center ${primerCarga ? '' : 'nuevo-llamado'}`;
                        card.innerHTML = `
                            <div>
                                <p class="text-[10px] text-emerald-600 font-bold uppercase tracking-widest mb-2">Llamado Actual</p>
                                <h4 class="text-6xl font-black text-slate-800">${p.nombre}</h4>
                                <p class="text-sm font-medium text-slate-400 uppercase mt-2">${p.motivo}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-4xl font-light text-slate-800">C01</p>
                                <p class="text-[10px] text-slate-400 font-bold mt-2 uppercase">Consultorio</p>
                            </div>
                        `;
                        consultaDiv.appendChild(card);
                    } else if (p.estado === 'espera') {
                        const row = document.createElement('div');
                        row.className = "macos-card p-5 rounded-2xl shadow-sm border-l-4 border-slate-300 flex justify-between items-center opacity-80";
                        row.innerHTML = `
                            <div>
                                <p class="text-2xl font-bold text-slate-700">${p.nombre}</p>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">${p.motivo}</p>
                            </div>
                            <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md uppercase">En Espera</span>
                        `;
                        esperaDiv.appendChild(row);
                    }
                });

                if (alguienNuevo && !primerCarga) {
                    playDingDong();
                }

                idsEnEscena = new Set(turnos.map(p => p.id));
                primerCarga = false;

            } catch (e) {
                console.error("Error cargando pantalla pública", e);
            }
        }

        function conectarWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            const socket = new WebSocket(wsUrl);
            socket.onmessage = () => cargarDatos();
            socket.onclose = () => setTimeout(conectarWS, 3000);
        }

        function playDingDong() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const audioCtx = new AudioContext();
            function playTone(freq, time, duration, vol) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(time);
                gain.gain.setValueAtTime(vol, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                osc.stop(time + duration);
            }
            const now = audioCtx.currentTime;
            playTone(880, now, 1.0, 0.5);       // Ding
            playTone(660, now + 0.6, 1.5, 0.5); // Dong
        }

        cargarDatos();
        conectarWS();
    </script>
</body>

</html>
