<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuve Voladora Component Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Replicando las clases del style.css para la demo */
        .nuve-alert {
            background-color: rgba(249, 249, 249, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 270px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .nuve-alert-title {
            font-size: 17px;
            font-weight: 700;
            color: black;
            text-align: center;
            line-height: 1.25;
            margin-bottom: 2px;
        }

        .nuve-alert-description {
            font-size: 13px;
            font-weight: 400;
            color: black;
            text-align: center;
            line-height: 1.4;
            padding: 0 4px;
            margin-bottom: 16px;
        }

        .nuve-alert-list {
            background-color: rgba(118, 118, 128, 0.12);
            border-radius: 14px;
            overflow: hidden;
            width: 100%;
        }

        .nuve-alert-item {
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 16px;
            font-size: 17px;
        }

        .nuve-alert-item-bold {
            font-weight: 600;
            color: black;
        }

        .nuve-alert-item-muted {
            font-weight: 400;
            color: rgba(60, 60, 67, 0.6);
        }

        .nuve-alert-divider {
            border-bottom: 0.5px solid rgba(198, 198, 200, 0.5);
            width: 100%;
        }

        .nuve-alert-actions {
            display: flex;
            border-top: 0.5px solid rgba(198, 198, 200, 0.5);
            margin-top: 16px;
            margin-left: -20px;
            margin-right: -20px;
            margin-bottom: -20px;
        }

        .nuve-alert-btn {
            flex: 1;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 600;
            color: #007aff;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .nuve-alert-btn:active {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .nuve-alert-btn-secondary {
            font-weight: 400;
            border-right: 0.5px solid rgba(198, 198, 200, 0.5);
        }
    </style>
</head>

<body class="bg-gray-400 min-h-screen flex items-center justify-center">

    <!-- Replicación exacta del componente de Figma -->
    <div class="nuve-alert">
        <h2 class="nuve-alert-title">A Short Title Is Best</h2>
        <p class="nuve-alert-description">
            A description should be a short, complete sentence.
        </p>

        <div class="nuve-alert-list">
            <div class="nuve-alert-item">
                <span class="nuve-alert-item-bold">Value</span>
            </div>
            <div class="nuve-alert-divider"></div>
            <div class="nuve-alert-item">
                <span class="nuve-alert-item-muted">Value</span>
            </div>
        </div>

        <div class="nuve-alert-actions">
            <button class="nuve-alert-btn nuve-alert-btn-secondary">Secondary</button>
            <button class="nuve-alert-btn">Primary</button>
        </div>
    </div>

</body>

</html>
