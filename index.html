<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DingDong | Medical Hub</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="/static/tailwindcss.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .column {
            min-height: 70vh;
            @apply column-nuve;
        }

        .column-active {
            @apply column-active-nuve;
        }

        /* Scrollbar minimalista Nuve Style */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #c7c7cc;
            border-radius: 10px;
        }
    </style>
</head>

<body class="min-h-screen p-6 md:p-10">

    <div class="max-w-7xl mx-auto">
        <!-- Barra Superior Nuve Style -->
        <header
            class="nuve-window p-5 mb-12 flex flex-col lg:flex-row justify-between items-center gap-6 sticky top-4 z-40 mx-2">
            <div class="flex items-center gap-3">
                <div class="flex gap-1.5 px-2">
                    <div class="w-3 h-3 rounded-full bg-[#ed4e9e]"></div> <!-- Fuschia -->
                    <div class="w-3 h-3 rounded-full bg-[#f3d9da]"></div> <!-- Peach -->
                    <div class="w-3 h-3 rounded-full bg-[#4deb9e]"></div> <!-- Evergreen -->
                </div>
                <div class="h-6 w-px bg-[#ecf1f4] mx-2"></div>
                <h1 class="text-xl font-bold tracking-tight text-[#0e0e10]">DingDong</h1>
            </div>

            <div class="flex items-center gap-2 flex-1 max-w-2xl px-4">
                <input type="text" id="nombreInput" placeholder="Nombre Paciente" class="nuve-input flex-1">
                <select id="motivoSelect" class="nuve-input nuve-select bg-white/50 cursor-pointer"></select>
                <button onclick="agregarPaciente()" class="nuve-button nuve-button-primary px-6">+ Nuevo Turno</button>
            </div>

            <div class="flex items-center gap-2">
                <a href="/publico" target="_blank" class="nuve-button p-2" title="Pantalla TV">📺</a>
                <button onclick="toggleModal()" class="nuve-button p-2" title="Configuración">⚙️</button>
            </div>
        </header>

        <!-- Stats - Nuve Layout -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="nuve-card p-6">
                <p class="text-[11px] font-bold text-[#0e0e10]/40 uppercase tracking-widest mb-1">Caja del día</p>
                <div class="flex justify-between items-end">
                    <p id="stat-ingresos" class="text-3xl font-bold text-[#0e0e10]">$0</p>
                    <span class="text-xs font-medium text-[#0e0e10]/30">MXN</span>
                </div>
            </div>
            <div class="nuve-card p-6">
                <p class="text-[11px] font-bold text-[#0e0e10]/40 uppercase tracking-widest mb-1">Atendidos</p>
                <p id="stat-atendidos" class="text-3xl font-bold text-[#0e0e10]">0</p>
            </div>
            <div class="nuve-card p-6">
                <p class="text-[11px] font-bold text-[#0e0e10]/40 uppercase tracking-widest mb-1">En espera</p>
                <p id="stat-espera" class="text-3xl font-bold text-[#0e0e10]">0</p>
            </div>
        </div>

        <!-- Board Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Espera -->
            <section class="flex flex-col gap-4">
                <div class="flex items-center justify-between px-4">
                    <h2 class="text-xs font-bold text-[#0e0e10]/50 uppercase tracking-wider">Sala de Espera</h2>
                    <span id="count-espera"
                        class="bg-[#ecf1f4] text-[#0e0e10] text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <div id="espera" class="column column-espera-nuve p-4 space-y-4 overflow-y-auto"
                    ondrop="drop(event, 'espera')" ondragover="allowDrop(event)"
                    ondragenter="this.classList.add('column-active')"
                    ondragleave="this.classList.remove('column-active')"></div>
            </section>

            <!-- Consulta -->
            <section class="flex flex-col gap-4">
                <div class="flex items-center justify-between px-4">
                    <h2 class="text-xs font-bold text-[#0e0e10]/50 uppercase tracking-wider">En Consulta</h2>
                    <span id="count-consulta"
                        class="bg-[#ecf1f4] text-[#4b56ed] text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <div id="consulta" class="column column-consulta-nuve p-4 space-y-4 overflow-y-auto"
                    ondrop="drop(event, 'consulta')" ondragover="allowDrop(event)"
                    ondragenter="this.classList.add('column-active')"
                    ondragleave="this.classList.remove('column-active')"></div>
            </section>

            <!-- Finalizado -->
            <section class="flex flex-col gap-4">
                <div class="flex items-center justify-between px-4">
                    <h2 class="text-xs font-bold text-[#0e0e10]/50 uppercase tracking-wider">Finalizados</h2>
                    <button onclick="exportarExcel()"
                        class="text-[10px] font-bold text-[#4b56ed] hover:underline underline-offset-4 decoration-2">Exportar</button>
                </div>
                <div id="finalizado" class="column column-finalizado-nuve p-4 space-y-4 overflow-y-auto"
                    ondrop="drop(event, 'finalizado')" ondragover="allowDrop(event)"
                    ondragenter="this.classList.add('column-active')"
                    ondragleave="this.classList.remove('column-active')"></div>
            </section>
        </div>
    </div>

    <!-- Modal Config Nuve Style -->
    <div id="modalConfig" class="fixed inset-0 nuve-config-overlay hidden flex justify-center items-center z-50 p-4">
        <div class="nuve-window-formal p-8 w-full max-w-sm">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-bold text-[#0e0e10]">Preferencias</h3>
                <button onclick="toggleModal()" class="text-[#0e0e10]/40 hover:text-[#0e0e10] text-lg">✕</button>
            </div>

            <div class="mb-8">
                <p class="nuve-config-title">Motivos registrados</p>
                <div id="listaMotivos" class="space-y-3 max-h-56 overflow-y-auto pr-2"></div>
            </div>

            <div class="nuve-config-section">
                <p class="nuve-section-title">Añadir Motivo</p>
                <div class="space-y-4">
                    <input id="nuevoMotivoNombre" placeholder="Nombre del servicio" class="nuve-input bg-white w-full">
                    <div class="flex gap-3">
                        <input id="nuevoMotivoMonto" type="number" placeholder="Precio $"
                            class="nuve-input bg-white flex-1">
                        <button onclick="guardarMotivo()" class="nuve-button nuve-button-primary px-6">OK</button>
                    </div>
                </div>
            </div>
            <button onclick="toggleModal()"
                class="w-full text-[15px] font-bold nuve-text-iris hover:nuve-text-fuschia transition-colors py-2 tracking-wide">Listo</button>
        </div>
    </div>

    <script>
        const API_URL = "";
        let idsConocidos = new Set();
        let primerCarga = true;
        let isDragging = false;

        document.addEventListener('DOMContentLoaded', () => {
            cargarTurnos();
            cargarMotivos();
            cargarStats();
            conectarWebSocket();
        });

        function conectarWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            const socket = new WebSocket(wsUrl);
            socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'update_turnos' && !isDragging) { cargarTurnos(); cargarStats(); }
                if (data.type === 'update_motivos') cargarMotivos();
            };
            socket.onclose = () => setTimeout(conectarWebSocket, 3000);
        }

        async function cargarTurnos() {
            const res = await fetch(`${API_URL}/turnos`);
            const datos = await res.json();
            const hayNuevos = datos.some(p => p.estado === 'espera' && !idsConocidos.has(p.id));
            if (hayNuevos && !primerCarga) playDingDong();
            idsConocidos = new Set(datos.map(p => p.id));
            primerCarga = false;
            ['espera', 'consulta', 'finalizado'].forEach(id => document.getElementById(id).innerHTML = '');
            datos.forEach(p => crearTarjetaHTML(p));
            actualizarContadores();
        }

        async function cargarStats() {
            const res = await fetch(`${API_URL}/stats`);
            const stats = await res.json();
            document.getElementById('stat-ingresos').innerText = `$${stats.ingresos.toLocaleString()}`;
            document.getElementById('stat-atendidos').innerText = stats.atendidos;
            document.getElementById('stat-espera').innerText = stats.espera;
        }

        function crearTarjetaHTML(paciente) {
            const tarjeta = document.createElement('div');
            tarjeta.className = `nuve-card p-4 status-${paciente.estado}-border cursor-grab active:cursor-grabbing group transition-all`;
            tarjeta.draggable = true;
            tarjeta.id = paciente.id;

            let duracion = paciente.estado === 'finalizado' ? `<p class="text-[10px] font-bold text-[#0e0e10]/40 mt-2 bg-[#ecf1f4] inline-block px-2 py-0.5 rounded-md">⏱ ${calcularTiempoTotal(paciente.hora_creacion, paciente.hora_salida)}</p>` : '';

            tarjeta.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <h4 class="font-bold text-[#0e0e10] text-sm">${paciente.nombre}</h4>
                        <p class="text-[10px] font-bold text-[#0e0e10]/50 uppercase tracking-tighter mt-1">${paciente.motivo}</p>
                    </div>
                    <button onclick="eliminarPaciente('${paciente.id}')" class="text-[#d1d9e0] hover:text-[#ed4e9e] transition-colors opacity-0 group-hover:opacity-100 p-1">✕</button>
                </div>
                <div class="flex justify-between items-center mt-4">
                    <span class="text-[10px] font-bold text-[#0e0e10]/40">🕒 ${paciente.hora_creacion}</span>
                    <span class="text-sm font-bold text-[#0e0e10]">$${paciente.monto}</span>
                </div>
                ${duracion}
            `;

            tarjeta.ondragstart = (e) => { e.dataTransfer.setData("text", paciente.id); tarjeta.classList.add('dragging'); isDragging = true; };
            tarjeta.ondragend = () => { tarjeta.classList.remove('dragging'); isDragging = false; };
            document.getElementById(paciente.estado).appendChild(tarjeta);
        }

        async function drop(e, estado) {
            e.preventDefault();
            const id = e.dataTransfer.getData("text");
            const res = await fetch(`${API_URL}/turnos/${id}/${estado}`, { method: 'PUT' });
            if (res.ok) { cargarTurnos(); cargarStats(); }
            document.querySelectorAll('.column').forEach(c => c.classList.remove('column-active'));
        }

        function allowDrop(e) { e.preventDefault(); }
        function toggleModal() { document.getElementById('modalConfig').classList.toggle('hidden'); }

        async function agregarPaciente() {
            const nombre = document.getElementById('nombreInput').value;
            const select = document.getElementById('motivoSelect');
            const motivo = select.value;
            const monto = select.options[select.selectedIndex]?.getAttribute('data-monto');
            if (!nombre) return;
            const res = await fetch(`${API_URL}/turnos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, motivo, monto: parseInt(monto) })
            });
            if (res.ok) { document.getElementById('nombreInput').value = ''; cargarTurnos(); }
        }

        async function cargarMotivos() {
            const res = await fetch(`${API_URL}/config/motivos`);
            const motivos = await res.json();
            document.getElementById('motivoSelect').innerHTML = motivos.map(m => `<option value="${m.nombre}" data-monto="${m.monto}">${m.nombre}</option>`).join('');
            document.getElementById('listaMotivos').innerHTML = motivos.map(m => `
                <div class="nuve-motive-item">
                    <span class="text-xs font-bold text-[#0e0e10]">${m.nombre} <b class="nuve-text-iris ml-1.5 ">$${m.monto}</b></span>
                    <button onclick="borrarMotivo('${m.nombre}')" class="text-[#d1d9e0] hover:nuve-text-fuschia transition-colors p-1">✕</button>
                </div>
            `).join('');
        }

        async function guardarMotivo() {
            const nombre = document.getElementById('nuevoMotivoNombre').value;
            const monto = document.getElementById('nuevoMotivoMonto').value;
            if (!nombre || !monto) return;
            await fetch(`${API_URL}/config/motivos`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre, monto: parseInt(monto) }) });
            document.getElementById('nuevoMotivoNombre').value = '';
            document.getElementById('nuevoMotivoMonto').value = '';
            cargarMotivos();
        }

        async function borrarMotivo(n) { if (confirm(`Eliminar ${n}?`)) await fetch(`${API_URL}/config/motivos/${n}`, { method: 'DELETE' }); cargarMotivos(); }
        async function eliminarPaciente(id) { if (confirm("¿Eliminar?")) await fetch(`${API_URL}/turnos/${id}`, { method: 'DELETE' }); }
        function exportarExcel() { window.location.href = `${API_URL}/exportar/finalizados`; }
        function a(i, f) { if (!i || !f) return '0m'; const [h1, m1] = i.split(':').map(Number), [h2, m2] = f.split(':').map(Number); let d = (h2 * 60 + m2) - (h1 * 60 + m1); if (d < 0) d += 1440; return d > 60 ? `${Math.floor(d / 60)}h ${d % 60}m` : `${d}m`; }
        function calcularTiempoTotal(i, f) { return a(i, f) }
        function actualizarContadores() {
            ['espera', 'consulta', 'finalizado'].forEach(e => {
                const col = document.getElementById(e);
                const badge = document.getElementById(`count-${e}`);
                if (col && badge) badge.innerText = col.children.length;
            });
        }
        function playDingDong() {
            const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return; const audioCtx = new AudioContext();
            function p(f, t, d) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination); o.start(t); g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t + d); o.stop(t + d); }
            const n = audioCtx.currentTime; p(880, n, 0.6); p(660, n + 0.4, 1);
        }
    </script>
</body>

</html>
